        }

        .error-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .error-links a {
            color: var(--gold);
            transition: 0.3s;
        }

        .error-links a:hover {
            color: var(--gold-light);
        }

        @media (max-width: 550px) {

            .error-content h2 {
                font-size: 24px;
            }
